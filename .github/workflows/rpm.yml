name: Download Docker RPMs for CentOS 8

on:
  workflow_dispatch:  

jobs:
  download-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Create script to run in container
        run: |
          cat > download-docker-rpms.sh << 'EOF'
          #!/bin/bash
          set -e

          dnf install -y yum-utils createrepo
          mkdir -p /docker-rpms

          dnf config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo

          cd /docker-rpms
          yumdownloader --resolve \
                        docker-ce \
                        docker-ce-cli \
                        containerd.io \
                        docker-buildx-plugin \
                        docker-compose-plugin \
                        docker-swarm

          # Liste des packages téléchargés
          echo "Packages téléchargés:"
          ls -la /docker-rpms
          EOF
          
          chmod +x download-docker-rpms.sh

      - name: Run CentOS 8 container to download RPMs
        run: |
          mkdir -p docker-rpms
          
          docker run --rm \
            -v $(pwd)/download-docker-rpms.sh:/download-docker-rpms.sh \
            -v $(pwd)/docker-rpms:/docker-rpms \
            quay.io/centos/centos:stream8 \
            /download-docker-rpms.sh

          echo "Contenu du répertoire docker-rpms:"
          ls -la docker-rpms

      - name: Archive RPMs
        run: |
          tar -czvf docker-centos8-rpms.tar.gz docker-rpms/

      - name: Upload RPM archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-centos8-rpms
          path: docker-rpms.tar.gz
