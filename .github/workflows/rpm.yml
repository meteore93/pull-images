name: Download RPM Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Liste des paquets à télécharger (séparés par des espaces)'
        required: true
        default: 'docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin'
      el_version:
        description: 'Version Enterprise Linux (7, 8, 9)'
        required: true
        default: '8'
      extra_repos:
        description: "URLs des dépôts supplémentaires (séparés par des virgules)"
        required: false
        default: 'https://download.docker.com/linux/centos/docker-ce.repo'
      packages_to_remove:
        description: 'Paquets à désinstaller avant téléchargement (séparés par des espaces)'
        required: false
        default: 'podman podman-docker'
      artifact_name:
        description: "Nom de l'artefact"
        required: true
        default: 'downloaded-rpms'

jobs:
  download-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Create script to run in container
        run: |
          cat > download-rpms.sh << 'EOF'
          #!/bin/bash
          set -e

          PACKAGES="${1}"
          EXTRA_REPOS="${2}"
          PACKAGES_TO_REMOVE="${3}"
          
          dnf install -y yum-utils createrepo dnf-plugins-core
          
          mkdir -p /rpm-packages
          
          IFS=',' read -ra REPO_URLS <<< "$EXTRA_REPOS"
          for REPO_URL in "${REPO_URLS[@]}"; do
            if [[ -n "$REPO_URL" ]]; then
              echo "Ajout du dépôt: $REPO_URL"
              dnf config-manager --add-repo="$REPO_URL"
            fi
          done
        
          if [[ -n "$PACKAGES_TO_REMOVE" ]]; then
            echo "Vérification et suppression des paquets conflictuels: $PACKAGES_TO_REMOVE"
            for PKG in $PACKAGES_TO_REMOVE; do
              if rpm -q "$PKG" > /dev/null 2>&1; then
                echo "Suppression de $PKG..."
                dnf remove -y "$PKG"
              else
                echo "$PKG n'est pas installé, aucune action nécessaire..."
              fi
            done
          fi
          
          dnf makecache
          
      
          cd /rpm-packages
          echo "Téléchargement des paquets: $PACKAGES"
          for PKG in $PACKAGES; do
            echo "Téléchargement de $PKG..."
            yumdownloader --resolve "$PKG" || echo "Avertissement: Impossible de télécharger $PKG..."
          done
          
          echo "Packages téléchargés:"
          ls -la /rpm-packages
          EOF
          
          chmod +x download-rpms.sh

      - name: Run container to download RPMs
        run: |
          # Créer un répertoire local pour stocker les RPMs
          mkdir -p rpm-packages
          
          if [ "${{ github.event.inputs.el_version }}" = "7" ]; then
            IMAGE="centos:7"
          elif [ "${{ github.event.inputs.el_version }}" = "9" ]; then
            IMAGE="rockylinux:9"
          else
            IMAGE="rockylinux:8"
          fi
          
          echo "Utilisation de l'image: $IMAGE"
          
          # Exécuter le conteneur avec le script
          docker run --rm \
            --dns 8.8.8.8 --dns 1.1.1.1 \
            -v $(pwd)/download-rpms.sh:/download-rpms.sh \
            -v $(pwd)/rpm-packages:/rpm-packages \
            $IMAGE \
            /download-rpms.sh "${{ github.event.inputs.packages }}"\
                              "${{ github.event.inputs.extra_repos }}"\
                              "${{ github.event.inputs.packages_to_remove }}"
          
          # Vérifier les RPMs téléchargés
          echo "Contenu du répertoire rpm-packages:"
          ls -la rpm-packages

      - name: Archive RPMs
        run: |
          tar -czvf ${{ github.event.inputs.artifact_name }}.tar.gz rpm-packages/

      - name: Upload RPM archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: ${{ github.event.inputs.artifact_name }}.tar.gz
