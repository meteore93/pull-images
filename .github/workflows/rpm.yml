name: Download Docker RPMs for RHEL/CentOS 8

on:
  workflow_dispatch:  # Permet de déclencher le workflow manuellement

jobs:
  download-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Create script to run in container
        run: |
          cat > download-docker-rpms.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "nameserver 8.8.8.8" > /etc/resolv.conf
          echo "nameserver 1.1.1.1" >> /etc/resolv.conf
          
          ping -c 2 google.com || echo "Warning: Ping failed but continuing"
          
          dnf install -y yum-utils createrepo dnf-plugins-core

          mkdir -p /docker-rpms

          dnf config-manager --add-repo=https://download.docker.com/linux/centos/docker-ce.repo

          # Vérifier les dépôts disponibles
          dnf repolist
          
          cd /docker-rpms
          yumdownloader --resolve docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          
          yumdownloader docker-swarm || echo "docker-swarm package non disponible, continuons"

          # Liste des packages téléchargés
          echo "Packages téléchargés:"
          ls -la /docker-rpms
          EOF
          
          chmod +x download-docker-rpms.sh

      - name: Run Rocky Linux 8 container to download RPMs
        run: |
          # Créer un répertoire local pour stocker les RPMs
          mkdir -p docker-rpms
          
          docker run --rm \
            --dns 8.8.8.8 --dns 1.1.1.1 \
            -v $(pwd)/download-docker-rpms.sh:/download-docker-rpms.sh \
            -v $(pwd)/docker-rpms:/docker-rpms \
            rockylinux:8 \
            /download-docker-rpms.sh

          echo "Contenu du répertoire docker-rpms:"
          ls -la docker-rpms

      - name: Archive RPMs
        run: |
          tar -czvf docker-el8-rpms.tar.gz docker-rpms/

      - name: Upload RPM archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-el8-rpms
          path: docker-el8-rpms.tar.gz
